name: test GitHub Actions EC2 SSH connectivity

on:
  push:
    branches: [ main ]

jobs:
  ssh-test:
    name: Test GitHub Actions to EC2 SSH
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/github_actions_key
          chmod 600 ~/.ssh/github_actions_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/github_actions_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH CONNECTION SUCCESSFUL'; hostname; whoami; docker --version; kubectl version --client"
